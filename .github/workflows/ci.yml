name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: booksys_test
          POSTGRES_USER: booksys
          POSTGRES_PASSWORD: booksys_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksys -d booksys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Run lint
        run: cd backend && npm run lint

      - name: Run typecheck
        run: cd backend && npx tsc --noEmit

      - name: Push DB schema
        run: cd backend && npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://booksys:booksys_test_pass@localhost:5432/booksys_test?schema=public

      - name: Run unit tests
        run: cd backend && npm test
        env:
          DATABASE_URL: postgresql://booksys:booksys_test_pass@localhost:5432/booksys_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          TICKET_SIGNING_SECRET: test-ticket-signing-secret
          PAYMENT_PROVIDER: mock
          MOCK_PAYMENT_SECRET: mock-webhook-secret-test
          HOLD_DURATION_MINUTES: "10"
          PAYMENT_TIMEOUT_MINUTES: "15"

      - name: Seed test data
        run: cd backend && npx ts-node prisma/seed.ts
        env:
          DATABASE_URL: postgresql://booksys:booksys_test_pass@localhost:5432/booksys_test?schema=public

      - name: Run e2e tests
        run: cd backend && npm run test:e2e
        env:
          DATABASE_URL: postgresql://booksys:booksys_test_pass@localhost:5432/booksys_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          JWT_EXPIRY: 1h
          FRONTEND_URL: http://localhost:3000
          TICKET_SIGNING_SECRET: test-ticket-signing-secret
          PAYMENT_PROVIDER: mock
          MOCK_PAYMENT_SECRET: mock-webhook-secret-test
          HOLD_DURATION_MINUTES: "10"
          PAYMENT_TIMEOUT_MINUTES: "15"

      - name: Run concurrency tests
        run: cd backend && npm run test:concurrency
        env:
          DATABASE_URL: postgresql://booksys:booksys_test_pass@localhost:5432/booksys_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          JWT_EXPIRY: 1h
          FRONTEND_URL: http://localhost:3000
          TICKET_SIGNING_SECRET: test-ticket-signing-secret
          PAYMENT_PROVIDER: mock
          MOCK_PAYMENT_SECRET: mock-webhook-secret-test
          HOLD_DURATION_MINUTES: "10"
          PAYMENT_TIMEOUT_MINUTES: "15"

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test-backend, lint-and-build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t booksys-backend ./backend

      - name: Build frontend image
        run: docker build -t booksys-frontend ./frontend

      - name: Health check
        run: |
          docker compose up -d
          sleep 15
          curl -f http://localhost:4000/api/health/ping || exit 1
          docker compose down
