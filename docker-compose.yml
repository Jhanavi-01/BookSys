services:
  postgres:
    image: postgres:15-alpine
    container_name: booksys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booksys
      POSTGRES_USER: booksys
      POSTGRES_PASSWORD: booksys_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booksys -d booksys"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booksys-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booksys-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://booksys:booksys_dev_pass@postgres:5432/booksys?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      JWT_EXPIRY: 24h
      FRONTEND_URL: http://localhost:3001
      TICKET_SIGNING_SECRET: dev-ticket-signing-secret-change-in-production
      PAYMENT_PROVIDER: mock
      MOCK_PAYMENT_SECRET: mock-webhook-secret-dev
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@booksys.local
      HOLD_DURATION_MINUTES: "10"
      PAYMENT_TIMEOUT_MINUTES: "15"
      WAITING_ROOM_THRESHOLD: "100"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: booksys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
